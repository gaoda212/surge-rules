[General]
skip-proxy = 10.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, 127.0.0.1, localhost, *.local
exclude-simple-hostnames = true
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 2
wifi-assist = true
ipv6 = false // 如无特殊需求不应开启 IPv6，目前网络环境下 IPv6 只会带来问题。
loglevel = notify
http-api = <REDACTED>@0.0.0.0:6171
http-api-tls = true
http-api-web-dashboard = true
ipv6-vif = auto
allow-hotspot-access = false
external-controller-access = <REDACTED>@0.0.0.0:6170
proxy-restricted-to-lan = false

