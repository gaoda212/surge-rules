# ============================================================
# Surge Profile 备份（iOS）
# ⚠️ 已脱敏：http-api 密码、订阅 token/sign 均为 <REDACTED>
#    恢复使用时需手动填回真实凭据
# 来源: surge-cli dump profile (originalProfile)
# ============================================================
[General]
skip-proxy = 10.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, 127.0.0.1, localhost, *.local
exclude-simple-hostnames = true
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 2
dns-server = system
wifi-assist = false
ipv6 = false // 如无特殊需求不应开启 IPv6，目前网络环境下 IPv6 只会带来问题。
loglevel = notify
http-api = <REDACTED>@0.0.0.0:6171
http-api-tls = true
http-api-web-dashboard = true
ipv6-vif = auto
allow-hotspot-access = false
external-controller-access = <REDACTED>@0.0.0.0:6170

[Proxy]
🇺🇸MEGABOX-PRO = snell, masked, 1234, psk=<masked>, version=6, mode=default, reuse=true, block-quic=adaptive
🇨🇳Home_r2s = tailscale, section-name=01F383AC, test-url=http://wifi.vivo.com.cn/generate_204, block-quic=adaptive, ecn=false
🇭🇰 HK01 0.20x = trojan, masked, 1234, password=<masked>, tfo=true, block-quic=adaptive, skip-cert-verify=true, sni=ixigua.com
🇸🇬 SG01 0.20x = trojan, masked, 1234, password=<masked>, tfo=true, block-quic=adaptive, skip-cert-verify=true, sni=ixigua.com
🇯🇵 JP01 0.20x = trojan, masked, 1234, password=<masked>, tfo=true, block-quic=adaptive, skip-cert-verify=true, sni=ixigua.com
🇨🇳 TW01 0.20x = trojan, masked, 1234, password=<masked>, tfo=true, block-quic=adaptive, skip-cert-verify=true, sni=ixigua.com

[Proxy Group]
Home = smart, 🇨🇳Home_r2s, DEVICE:MAC_HOME, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/lige.png, persistent=1
United States = select, 🇺🇸MEGABOX-PRO, no-alert=0, hidden=0, include-all-proxies=0, icon-url=EMOJI::🇺🇸
SNTP = smart, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/06jichang/shouhou(11)SNTP-emby.png, policy-path=https://masked/, update-interval=0, policy-regex-filter=^(?!.*🇺🇸).*

[Rule]
# AD
RULE-SET,https://adrules.top/adrules.list,REJECT-DROP,no-resolve
PROTOCOL,STUN,REJECT
# Apple
RULE-SET,https://raw.githubusercontent.com/RocM301/Apple-Rule/refs/heads/main/Apple-AI.list,🇺🇸MEGABOX-PRO
RULE-SET,https://rule.kelee.one/Loon/Apple.lsr,🇺🇸MEGABOX-PRO
# Customization
DOMAIN-SUFFIX,sub1.sntp.me,🇨🇳Home_r2s
DOMAIN-SUFFIX,caiyunapp.com,🇨🇳Home_r2s
# DeepSeek
DOMAIN-SUFFIX,deepseek.com,🇨🇳Home_r2s
# EMBY
DOMAIN-SUFFIX,mobaiemby.site,🇺🇸MEGABOX-PRO
DOMAIN-SUFFIX,cn2gias.uk,SNTP
# China
RULE-SET,https://rule.kelee.one/Loon/ChinaMax.lsr,DIRECT,no-resolve
# 以下规则将触发本地 DNS 解析
RULE-SET,LAN,🇨🇳Home_r2s,no-resolve
GEOIP,CN,REJECT,no-resolve
DOMAIN-SUFFIX,cn,REJECT
FINAL,🇺🇸MEGABOX-PRO,dns-failed

[MITM]
tcp-connection = true
h2 = true
hostname = www.google.cn
ca-passphrase = -
ca-p12 = -

[MTProto]
interface = 127.0.0.1
port = 5753
secret = <masked>
ipv6 = false
dc-config-url = https://github.com/Repcz/Tool/raw/X/Surge/mtproto-dc-config.json

[Tailscale 01F383AC]
interactive-login = true
exit-node = auto
